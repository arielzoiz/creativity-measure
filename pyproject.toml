[project]
name = "creativity-measure"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "torch",
  "jaxtyping",
  "matplotlib",
  "numpy<2",
  "scikit-learn",
]

[project.optional-dependencies]
dev = [
  "pyright",
  "beartype",
  "pytest",
  "nbdime",
]

# versions are pinned so it could run on a Mac with an Intel CPU
models = [
  "diffusers==0.27.2",
  "huggingface_hub==0.23.4",
  "transformers==4.42.4",
  "safetensors==0.4.3",
]

[tool.setuptools.packages.find]
include = ["creativity_measure*"]

[tool.pytest.ini_options]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.pyright]
include = ["creativity_measure", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportPrivateImportUsage = false
