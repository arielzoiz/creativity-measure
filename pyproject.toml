[project]
name = "creativity-measure"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "torch",
  "jaxtyping",
  "matplotlib",
  "numpy<2",
  "scikit-learn",
]

[project.optional-dependencies]
dev = [
  "pyright",
  "beartype",
  "pytest",
  "nbdime",
]

# versions are pinned so it could run on a Mac with an Intel CPU
models = [
  "diffusers==0.27.2",
  "huggingface_hub==0.23.4",
  "transformers==4.42.4",
  "safetensors==0.4.3",
]

# FLUX.1-dev needs FluxPipeline, which first ships in diffusers 0.30.0 -- the `models`
# pins above predate it. Kept as a separate extra so `models` stays Intel-Mac-runnable.
# sentencepiece/protobuf are required by the T5 tokenizer FLUX uses for its second
# text encoder; accelerate is what makes the ~24G bf16 transformer load without a
# full fp32 CPU copy first.
flux = [
  "diffusers>=0.31",
  # <5 on purpose: diffusers bounds transformers only under its test/dev extras, so an
  # unbounded pin resolves to 5.x, which FLUX's pipeline code has not been written against.
  "transformers>=4.44,<5",
  "accelerate",
  "sentencepiece",
  "protobuf",
]

[tool.setuptools.packages.find]
include = ["creativity_measure*"]

[tool.pytest.ini_options]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.pyright]
include = ["creativity_measure", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportPrivateImportUsage = false
